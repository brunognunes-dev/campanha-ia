[theme]
primaryColor = "#8B5CF6"
backgroundColor = "#090B13"
secondaryBackgroundColor = "#111525"
textColor = "#F8FAFC"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
